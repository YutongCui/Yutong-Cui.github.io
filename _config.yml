# ==========课题研究内容==========
research_content:
  - item: Dualmodal (FL/US) Imaging Probe for Glioma Diagnosis
    desc: Developed PEI-modified gas vesicle loaded CY5 probe; realized high-intensity fluorescence and ultrasound dual-mode orthotopic glioma in-vivo imaging with improved BBB penetration.
  - item: Injectable Probiotic/Squid Ink Hydrogel for MRSA-Infected Abscess
    desc: Fabricated alginate-based composite hydrogel combining probiotics and squid ink; achieved 92.5% MRSA elimination via photothermal-probiotic synergy and full abscess repair within 14 days.
  - item: GV-Based Targeted Drug Delivery for Glioma Theranostics
    desc: DOX-conjugated gas vesicle carrier with pH-responsive release, low systemic toxicity and excellent glioma targeted killing performance.
  - item: Ultrasound-Responsive Gold Nanocluster-Decorated GV (GV-Au)
    desc: AuNCs modified gas vesicles, ultrasound-triggered enhanced cell uptake and fluorescence imaging signal.

